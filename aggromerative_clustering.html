<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agglomerative Clustering: Interactive Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            color: #222;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            color: #111;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: #fafafa;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #e0e0e0;
        }

        .panel-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Scatter Plot */
        .scatter-container {
            position: relative;
            width: 100%;
            height: 400px;
            background: #fff;
            border-radius: 10px;
            border: 1px solid #ddd;
            overflow: hidden;
        }

        #scatterCanvas {
            width: 100%;
            height: 100%;
        }

        /* Dendrogram */
        .dendro-container {
            position: relative;
            width: 100%;
            height: 400px;
            background: #fff;
            border-radius: 10px;
            border: 1px solid #ddd;
            overflow: hidden;
        }

        #dendroCanvas {
            width: 100%;
            height: 100%;
        }

        /* Threshold Slider */
        .threshold-control {
            margin-top: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .threshold-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #333;
        }

        .threshold-value {
            color: #e74c3c;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .slider-container {
            position: relative;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #ccc, #999);
            border-radius: 4px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #e74c3c;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.4);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #333;
            color: #fff;
            font-weight: bold;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ccc;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .btn-primary:hover {
            background: #111;
        }

        /* Linkage Selection */
        .linkage-select {
            padding: 10px 15px;
            border-radius: 8px;
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ccc;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .linkage-select option {
            background: #fff;
            color: #333;
        }

        /* Info Panel */
        .info-panel {
            background: #fafafa;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #e0e0e0;
        }

        .cluster-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .cluster-card {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #eee;
        }

        .cluster-card .number {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
        }

        .cluster-card .label {
            font-size: 0.8rem;
            color: #666;
            margin-top: 5px;
        }

        /* Step History */
        .step-history {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #fff;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            border: 1px solid #eee;
            color: #333;
        }

        .step-item.active {
            background: #f0f7ff;
            border-left: 3px solid #4a90d9;
        }

        .step-item.future {
            opacity: 0.4;
        }

        .step-number {
            background: #f0f0f0;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: #333;
        }

        .step-distance {
            color: #e74c3c;
            font-weight: bold;
            margin-left: auto;
        }

        /* Animation */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .merging {
            animation: pulse 0.5s ease-in-out;
        }

        /* Legend */
        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #555;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Agglomerative Clustering</h1>
        <p class="subtitle">Interactive visualization with dendrogram and distance threshold</p>

        <div class="controls">
            <button class="btn btn-primary" onclick="generateNewData()">
                🎲 New Data
            </button>
            <button class="btn btn-secondary" onclick="stepForward()">
                ▶ Step Forward
            </button>
            <button class="btn btn-secondary" onclick="stepBackward()">
                ◀ Step Back
            </button>
            <button class="btn btn-secondary" onclick="resetClustering()">
                ↺ Reset
            </button>
            <button class="btn btn-secondary" onclick="autoPlay()">
                ⏵ Auto Play
            </button>
            <select class="linkage-select" id="linkageMethod" onchange="resetClustering()">
                <option value="single">Single Linkage (MIN)</option>
                <option value="complete">Complete Linkage (MAX)</option>
                <option value="average">Average Linkage</option>
            </select>
        </div>

        <div class="main-content">
            <div class="panel">
                <div class="panel-title">📍 Data Points</div>
                <div class="scatter-container">
                    <canvas id="scatterCanvas"></canvas>
                </div>
                <div class="legend" id="clusterLegend"></div>
            </div>

            <div class="panel">
                <div class="panel-title">🌳 Dendrogram</div>
                <div class="dendro-container">
                    <canvas id="dendroCanvas"></canvas>
                </div>
                <div class="threshold-control">
                    <div class="threshold-label">
                        <span>Distance Threshold (cut line)</span>
                        <span class="threshold-value" id="thresholdValue">0.00</span>
                    </div>
                    <div class="slider-container">
                        <input type="range" id="thresholdSlider" min="0" max="100" value="100" 
                               oninput="updateThreshold(this.value)">
                    </div>
                </div>
            </div>
        </div>

        <div class="info-panel">
            <div class="panel-title">📊 Clustering Information</div>
            <div class="cluster-info">
                <div class="cluster-card">
                    <div class="number" id="numClusters">0</div>
                    <div class="label">Current Clusters</div>
                </div>
                <div class="cluster-card">
                    <div class="number" id="numPoints">0</div>
                    <div class="label">Total Points</div>
                </div>
                <div class="cluster-card">
                    <div class="number" id="currentStep">0</div>
                    <div class="label">Merge Step</div>
                </div>
                <div class="cluster-card">
                    <div class="number" id="maxDistance">0.00</div>
                    <div class="label">Max Distance</div>
                </div>
            </div>

            <div class="step-history" id="stepHistory">
                <div class="panel-title" style="margin-top: 15px; margin-bottom: 10px;">📝 Merge History</div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let points = [];
        let mergeHistory = [];
        let currentStep = 0;
        let maxMergeDistance = 0;
        let threshold = 100;
        let isAutoPlaying = false;

        // Colors for clusters
        const clusterColors = [
            '#4facfe', '#00f2fe', '#ff6b6b', '#feca57', '#48dbfb',
            '#ff9ff3', '#54a0ff', '#5f27cd', '#00d2d3', '#ff9f43',
            '#10ac84', '#ee5a24', '#9b59b6', '#1abc9c', '#e74c3c'
        ];

        // Point labels
        const pointLabels = 'abcdefghijklmnopqrstuvwxyz'.split('');

        // Initialize
        function init() {
            generateNewData();
        }

        // Generate random clustered data
        function generateNewData() {
            points = [];
            const numPoints = 8 + Math.floor(Math.random() * 5); // 8-12 points
            
            // Generate points with some natural clustering
            const numCenters = 2 + Math.floor(Math.random() * 2);
            const centers = [];
            
            for (let i = 0; i < numCenters; i++) {
                centers.push({
                    x: 100 + Math.random() * 300,
                    y: 100 + Math.random() * 200
                });
            }

            for (let i = 0; i < numPoints; i++) {
                const center = centers[Math.floor(Math.random() * numCenters)];
                points.push({
                    id: i,
                    label: pointLabels[i] || `p${i}`,
                    x: center.x + (Math.random() - 0.5) * 120,
                    y: center.y + (Math.random() - 0.5) * 100,
                    cluster: i
                });
            }

            resetClustering();
        }

        // Calculate distance between two points
        function distance(p1, p2) {
            return Math.sqrt((p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2);
        }

        // Calculate cluster distance based on linkage method
        function clusterDistance(cluster1, cluster2, method) {
            const points1 = points.filter(p => p.cluster === cluster1);
            const points2 = points.filter(p => p.cluster === cluster2);
            
            let distances = [];
            for (let p1 of points1) {
                for (let p2 of points2) {
                    distances.push(distance(p1, p2));
                }
            }

            switch (method) {
                case 'single':
                    return Math.min(...distances);
                case 'complete':
                    return Math.max(...distances);
                case 'average':
                    return distances.reduce((a, b) => a + b, 0) / distances.length;
                default:
                    return Math.min(...distances);
            }
        }

        // Perform agglomerative clustering
        function computeClustering() {
            mergeHistory = [];
            
            // Reset clusters
            points.forEach((p, i) => p.cluster = i);
            
            const method = document.getElementById('linkageMethod').value;
            
            while (true) {
                // Get unique clusters
                const clusters = [...new Set(points.map(p => p.cluster))];
                
                if (clusters.length <= 1) break;

                // Find closest pair of clusters
                let minDist = Infinity;
                let mergePair = null;

                for (let i = 0; i < clusters.length; i++) {
                    for (let j = i + 1; j < clusters.length; j++) {
                        const dist = clusterDistance(clusters[i], clusters[j], method);
                        if (dist < minDist) {
                            minDist = dist;
                            mergePair = [clusters[i], clusters[j]];
                        }
                    }
                }

                if (!mergePair) break;

                // Record merge
                const cluster1Points = points.filter(p => p.cluster === mergePair[0]).map(p => p.label);
                const cluster2Points = points.filter(p => p.cluster === mergePair[1]).map(p => p.label);
                
                mergeHistory.push({
                    step: mergeHistory.length + 1,
                    cluster1: mergePair[0],
                    cluster2: mergePair[1],
                    cluster1Labels: cluster1Points,
                    cluster2Labels: cluster2Points,
                    distance: minDist,
                    newCluster: Math.min(mergePair[0], mergePair[1])
                });

                // Merge clusters
                const newClusterId = Math.min(mergePair[0], mergePair[1]);
                points.forEach(p => {
                    if (p.cluster === mergePair[0] || p.cluster === mergePair[1]) {
                        p.cluster = newClusterId;
                    }
                });
            }

            maxMergeDistance = Math.max(...mergeHistory.map(m => m.distance));
            
            // Reset to initial state
            points.forEach((p, i) => p.cluster = i);
            currentStep = 0;
            threshold = maxMergeDistance * 1.1;
            
            document.getElementById('thresholdSlider').max = Math.ceil(maxMergeDistance * 1.2);
            document.getElementById('thresholdSlider').value = threshold;
            
            updateDisplay();
        }

        // Reset clustering
        function resetClustering() {
            isAutoPlaying = false;
            computeClustering();
        }

        // Apply merges up to current step
        function applyMerges(upToStep) {
            // Reset all points to individual clusters
            points.forEach((p, i) => p.cluster = i);
            
            // Apply merges
            for (let i = 0; i < upToStep; i++) {
                const merge = mergeHistory[i];
                points.forEach(p => {
                    if (p.cluster === merge.cluster1 || p.cluster === merge.cluster2) {
                        p.cluster = merge.newCluster;
                    }
                });
            }
        }

        // Step forward
        function stepForward() {
            if (currentStep < mergeHistory.length) {
                currentStep++;
                applyMerges(currentStep);
                
                // Update threshold to show the merge
                if (currentStep > 0) {
                    threshold = mergeHistory[currentStep - 1].distance;
                    document.getElementById('thresholdSlider').value = threshold;
                }
                
                updateDisplay();
            }
        }

        // Step backward
        function stepBackward() {
            if (currentStep > 0) {
                currentStep--;
                applyMerges(currentStep);
                
                // Update threshold
                if (currentStep > 0) {
                    threshold = mergeHistory[currentStep - 1].distance;
                } else {
                    threshold = 0;
                }
                document.getElementById('thresholdSlider').value = threshold;
                
                updateDisplay();
            }
        }

        // Auto play
        function autoPlay() {
            if (isAutoPlaying) {
                isAutoPlaying = false;
                return;
            }
            
            isAutoPlaying = true;
            currentStep = 0;
            applyMerges(0);
            threshold = 0;
            updateDisplay();

            function nextStep() {
                if (!isAutoPlaying || currentStep >= mergeHistory.length) {
                    isAutoPlaying = false;
                    return;
                }
                
                stepForward();
                setTimeout(nextStep, 1000);
            }

            setTimeout(nextStep, 500);
        }

        // Update threshold from slider
        function updateThreshold(value) {
            threshold = parseFloat(value);
            
            // Find which step corresponds to this threshold
            let step = 0;
            for (let i = 0; i < mergeHistory.length; i++) {
                if (mergeHistory[i].distance <= threshold) {
                    step = i + 1;
                }
            }
            
            currentStep = step;
            applyMerges(currentStep);
            updateDisplay();
        }

        // Update display
        function updateDisplay() {
            drawScatterPlot();
            drawDendrogram();
            updateInfo();
            updateStepHistory();
            updateLegend();
        }

        // Draw scatter plot
        function drawScatterPlot() {
            const canvas = document.getElementById('scatterCanvas');
            const ctx = canvas.getContext('2d');
            
            // Set canvas size
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            ctx.scale(2, 2);

            const width = rect.width;
            const height = rect.height;

            // Clear
            ctx.clearRect(0, 0, width, height);

            // Get unique clusters and assign colors
            const clusters = [...new Set(points.map(p => p.cluster))].sort((a, b) => a - b);
            const clusterColorMap = {};
            clusters.forEach((c, i) => {
                clusterColorMap[c] = clusterColors[i % clusterColors.length];
            });

            // Draw connections within clusters
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.3;
            for (let cluster of clusters) {
                const clusterPoints = points.filter(p => p.cluster === cluster);
                ctx.strokeStyle = '#999';
                
                for (let i = 0; i < clusterPoints.length; i++) {
                    for (let j = i + 1; j < clusterPoints.length; j++) {
                        ctx.beginPath();
                        ctx.moveTo(clusterPoints[i].x, clusterPoints[i].y);
                        ctx.lineTo(clusterPoints[j].x, clusterPoints[j].y);
                        ctx.stroke();
                    }
                }
            }
            ctx.globalAlpha = 1;

            // Draw points
            for (let point of points) {
                const color = clusterColorMap[point.cluster];
                
                // Point circle
                ctx.beginPath();
                ctx.arc(point.x, point.y, 20, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                
                // Point border
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Label
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px Segoe UI';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(point.label, point.x, point.y);
            }
        }

        // Draw dendrogram
        function drawDendrogram() {
            const canvas = document.getElementById('dendroCanvas');
            const ctx = canvas.getContext('2d');
            
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            ctx.scale(2, 2);

            const width = rect.width;
            const height = rect.height;
            const padding = { top: 40, bottom: 60, left: 60, right: 30 };

            ctx.clearRect(0, 0, width, height);

            if (mergeHistory.length === 0) return;

            // Calculate positions for leaves
            const leaves = points.map(p => p.label).sort();
            const leafWidth = (width - padding.left - padding.right) / leaves.length;
            const leafPositions = {};
            leaves.forEach((label, i) => {
                leafPositions[label] = padding.left + (i + 0.5) * leafWidth;
            });

            // Scale for height
            const maxDist = maxMergeDistance * 1.1;
            const scaleY = (dist) => padding.top + (1 - dist / maxDist) * (height - padding.top - padding.bottom);

            // Track cluster positions (x position and labels)
            let clusterInfo = {};
            leaves.forEach(label => {
                clusterInfo[label] = {
                    x: leafPositions[label],
                    labels: [label]
                };
            });

            // Build dendrogram structure
            const merges = [];
            let tempClusterInfo = JSON.parse(JSON.stringify(clusterInfo));

            for (let merge of mergeHistory) {
                const labels1 = merge.cluster1Labels;
                const labels2 = merge.cluster2Labels;
                
                // Find x positions
                let x1 = 0, x2 = 0;
                let allLabels1 = [], allLabels2 = [];
                
                for (let label in tempClusterInfo) {
                    if (labels1.some(l => tempClusterInfo[label].labels.includes(l))) {
                        x1 = tempClusterInfo[label].x;
                        allLabels1 = tempClusterInfo[label].labels;
                    }
                    if (labels2.some(l => tempClusterInfo[label].labels.includes(l))) {
                        x2 = tempClusterInfo[label].x;
                        allLabels2 = tempClusterInfo[label].labels;
                    }
                }

                const newX = (x1 + x2) / 2;
                const newLabels = [...allLabels1, ...allLabels2];
                
                merges.push({
                    x1, x2, newX,
                    distance: merge.distance,
                    labels: newLabels,
                    step: merge.step
                });

                // Update cluster info
                const newKey = newLabels.join(',');
                tempClusterInfo[newKey] = { x: newX, labels: newLabels };
                
                // Remove old entries
                for (let label in tempClusterInfo) {
                    if (label !== newKey && 
                        (allLabels1.some(l => tempClusterInfo[label].labels.includes(l)) ||
                         allLabels2.some(l => tempClusterInfo[label].labels.includes(l)))) {
                        delete tempClusterInfo[label];
                    }
                }
            }

            // Draw Y axis
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(padding.left - 10, padding.top);
            ctx.lineTo(padding.left - 10, height - padding.bottom);
            ctx.stroke();

            // Y axis labels
            ctx.fillStyle = '#666';
            ctx.font = '11px Segoe UI';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            
            const numTicks = 5;
            for (let i = 0; i <= numTicks; i++) {
                const dist = (maxDist / numTicks) * i;
                const y = scaleY(dist);
                
                ctx.fillText(dist.toFixed(1), padding.left - 15, y);
                
                // Tick mark
                ctx.beginPath();
                ctx.moveTo(padding.left - 12, y);
                ctx.lineTo(padding.left - 8, y);
                ctx.stroke();
            }

            // Y axis title
            ctx.save();
            ctx.translate(15, height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#555';
            ctx.font = '12px Segoe UI';
            ctx.fillText('Distance', 0, 0);
            ctx.restore();

            // Draw dendrogram links
            ctx.lineWidth = 2;
            
            // Track lowest y for each leaf (to draw vertical lines from leaves)
            const leafBottomY = {};
            leaves.forEach(label => {
                leafBottomY[label] = height - padding.bottom;
            });

            // Process merges to draw the tree
            const nodeY = {}; // Track y position of each cluster
            leaves.forEach(label => {
                nodeY[label] = height - padding.bottom;
            });

            for (let i = 0; i < merges.length; i++) {
                const merge = merges[i];
                const y = scaleY(merge.distance);
                const isActive = i < currentStep;
                
                // Find the y positions of the two clusters being merged
                // For initial leaves, it's the bottom
                // For merged clusters, it's their merge height
                let y1 = height - padding.bottom;
                let y2 = height - padding.bottom;
                
                // Check if these are already merged clusters
                for (let j = 0; j < i; j++) {
                    if (merges[j].labels.every(l => merge.labels.includes(l))) {
                        if (Math.abs(merges[j].newX - merge.x1) < 1) {
                            y1 = scaleY(merges[j].distance);
                        }
                        if (Math.abs(merges[j].newX - merge.x2) < 1) {
                            y2 = scaleY(merges[j].distance);
                        }
                    }
                }

                ctx.strokeStyle = isActive ? '#4a90d9' : '#bbb';
                ctx.globalAlpha = isActive ? 1 : 0.7;

                // Draw U shape
                // Left vertical
                ctx.beginPath();
                ctx.moveTo(merge.x1, y1);
                ctx.lineTo(merge.x1, y);
                ctx.stroke();

                // Right vertical
                ctx.beginPath();
                ctx.moveTo(merge.x2, y2);
                ctx.lineTo(merge.x2, y);
                ctx.stroke();

                // Horizontal connector
                ctx.beginPath();
                ctx.moveTo(merge.x1, y);
                ctx.lineTo(merge.x2, y);
                ctx.stroke();

                // Draw merge point
                if (isActive) {
                    ctx.beginPath();
                    ctx.arc(merge.newX, y, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#4a90d9';
                    ctx.fill();
                }
            }

            ctx.globalAlpha = 1;

            // Draw leaf labels
            ctx.fillStyle = '#333';
            ctx.font = 'bold 14px Segoe UI';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            
            leaves.forEach(label => {
                ctx.fillText(label, leafPositions[label], height - padding.bottom + 10);
            });

            // Draw threshold line (red horizontal line)
            if (threshold > 0 && threshold <= maxDist) {
                const thresholdY = scaleY(threshold);
                
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(padding.left - 10, thresholdY);
                ctx.lineTo(width - padding.right, thresholdY);
                ctx.stroke();
                ctx.setLineDash([]);

                // Threshold label
                ctx.fillStyle = '#e74c3c';
                ctx.font = 'bold 11px Segoe UI';
                ctx.textAlign = 'left';
                ctx.fillText(`cut: ${threshold.toFixed(2)}`, width - padding.right + 5, thresholdY - 5);
            }

            // Update threshold display
            document.getElementById('thresholdValue').textContent = threshold.toFixed(2);
        }

        // Update info panel
        function updateInfo() {
            const clusters = [...new Set(points.map(p => p.cluster))];
            
            document.getElementById('numClusters').textContent = clusters.length;
            document.getElementById('numPoints').textContent = points.length;
            document.getElementById('currentStep').textContent = currentStep;
            document.getElementById('maxDistance').textContent = maxMergeDistance.toFixed(2);
        }

        // Update step history
        function updateStepHistory() {
            const container = document.getElementById('stepHistory');
            
            let html = '<div class="panel-title" style="margin-top: 15px; margin-bottom: 10px;">📝 Merge History</div>';
            
            for (let i = 0; i < mergeHistory.length; i++) {
                const merge = mergeHistory[i];
                const isActive = i === currentStep - 1;
                const isFuture = i >= currentStep;
                
                html += `
                    <div class="step-item ${isActive ? 'active' : ''} ${isFuture ? 'future' : ''}">
                        <span class="step-number">${merge.step}</span>
                        <span>Merge {${merge.cluster1Labels.join(',')}} ∪ {${merge.cluster2Labels.join(',')}}</span>
                        <span class="step-distance">${merge.distance.toFixed(2)}</span>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }

        // Update legend
        function updateLegend() {
            const clusters = [...new Set(points.map(p => p.cluster))].sort((a, b) => a - b);
            const container = document.getElementById('clusterLegend');
            
            let html = '';
            clusters.forEach((cluster, i) => {
                const clusterPoints = points.filter(p => p.cluster === cluster).map(p => p.label);
                const color = clusterColors[i % clusterColors.length];
                
                html += `
                    <div class="legend-item">
                        <span class="legend-color" style="background: ${color}"></span>
                        <span>Cluster: {${clusterPoints.join(', ')}}</span>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // Initialize on load
        window.onload = init;
        window.onresize = updateDisplay;
    </script>
</body>
</html>
